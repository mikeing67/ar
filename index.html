<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>拓印AR毕设</title>
    <!-- 引入本地离线库（关键！不再依赖CDN） -->
    <script src="mindar-image.prod.js"></script>
    <script src="three.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #ar-container { width: 100vw; height: 100vh; }
        .tip { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 14px; z-index: 999; }
    </style>
</head>
<body>
    <div class="tip">点击屏幕启动AR → 对准拓片播放动画</div>
    <div id="ar-container"></div>

    <script>
        // 等待所有本地库加载完成
        window.onload = async () => {
            // 先验证库是否加载成功
            if (!window.MINDAR) {
                alert('MindAR库加载失败！请检查文件是否存在：mindar-image.prod.js');
                return;
            }
            if (!window.THREE) {
                alert('Three.js库加载失败！请检查文件是否存在：three.min.js');
                return;
            }

            // 绑定点击事件启动AR
            document.addEventListener('click', initAR, { once: true });
        };

        // 核心AR初始化函数
        async function initAR() {
            try {
                // 1. 初始化MindAR（本地库已加载，必能找到MINDAR）
                const mindarThree = new window.MINDAR.IMAGE.MindARThree({
                    container: document.getElementById('ar-container'),
                    imageTargetSrc: 'targets.mind',
                    maxTrack: 1,
                    filterMinCF: 0.3 // 极低识别阈值，确保容易识别
                });

                const { renderer, scene, camera } = mindarThree;
                scene.background = new THREE.Color(0x000000);

                // 2. 加载视频（本地文件）
                const video = document.createElement('video');
                video.src = 'animation.mp4';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                await video.load();

                // 3. 创建视频平面
                const videoTexture = new THREE.VideoTexture(video);
                const plane = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.8, 0.8),
                    new THREE.MeshBasicMaterial({ map: videoTexture, transparent: true })
                );

                // 4. 绑定识别目标
                const anchor = mindarThree.addAnchor(0);
                anchor.group.add(plane);

                // 5. 启动AR
                await mindarThree.start();
                renderer.setAnimationLoop(() => {
                    if (anchor.group.visible && video.paused) {
                        video.play().catch(() => {});
                    }
                    renderer.render(scene, camera);
                });

                document.querySelector('.tip').textContent = 'AR已启动 → 对准拓片播放动画';

            } catch (err) {
                alert(`AR启动失败：${err.message}\n请检查：1. 本地库文件是否存在 2. targets.mind是否正确 3. animation.mp4是否存在`);
                console.error('错误详情:', err);
            }
        }
    </script>
</body>
</html>
