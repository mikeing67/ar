<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>拓印AR毕设</title>
    <!-- 用兼容版MindAR（内置Three.js，无需单独引入） -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #ar-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="ar-container"></div>

    <script>
        // 极简AR初始化逻辑
        async function startAR() {
            try {
                // 初始化MindAR（核心：用正确的构造函数）
                const mindar = new MindARImageThree({
                    container: document.getElementById('ar-container'),
                    imageTargetSrc: 'targets.mind'
                });
                const { renderer, scene, camera } = mindar;

                // 加载视频
                const video = document.createElement('video');
                video.src = 'animation.mp4';
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                await video.load();

                // 创建视频平面
                const videoTexture = new THREE.VideoTexture(video);
                const plane = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1),
                    new THREE.MeshBasicMaterial({ map: videoTexture, transparent: true })
                );

                // 绑定到识别目标
                const anchor = mindar.addAnchor(0);
                anchor.group.add(plane);

                // 启动AR
                await mindar.start();
                renderer.setAnimationLoop(() => {
                    if (anchor.group.visible) video.play();
                    renderer.render(scene, camera);
                });

            } catch (err) {
                alert('AR启动失败：' + err.message + '\n错误类型：' + err.name);
                console.error('详细错误：', err);
            }
        }

        // 页面加载后启动（兼容移动端）
        window.onload = () => {
            // 手动触发（解决移动端自动播放限制）
            document.body.addEventListener('click', startAR, { once: true });
            // 提示用户点击屏幕启动
            alert('请点击屏幕启动AR，然后对准拓片');
        };
    </script>
</body>
</html>
