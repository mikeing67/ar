<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>拓印AR毕设</title>
    <!-- 先引入Three.js核心库（必须！） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <!-- 引入MindAR库（注意首字母小写m） -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: black; }
        #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        // 等待所有库加载完成再初始化
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // 初始化MindAR（修正首字母小写m）
                const mindarThree = new window.MindAR.IMAGE.MindARThree({
                    container: document.getElementById('canvas'),
                    imageTargetSrc: 'targets.mind', // 对应你的拓片识别文件
                    maxTrack: 1 // 只识别1个目标，节省性能
                });
                const { renderer, scene, camera } = mindarThree;

                // 创建背景（黑色，避免透明闪烁）
                scene.background = new THREE.Color(0x000000);

                // 加载动画视频（处理手机自动播放限制）
                const video = document.createElement('video');
                video.src = 'animation.mp4';
                video.loop = true;
                video.muted = true; // 静音必加，否则手机无法自动播放
                video.playsInline = true; // 移动端内联播放
                await video.load();

                // 创建视频纹理和播放平面
                const videoTexture = new THREE.VideoTexture(video);
                const geometry = new THREE.PlaneGeometry(0.5, 0.5); // 适配拓片大小（可调整）
                const material = new THREE.MeshBasicMaterial({
                    map: videoTexture,
                    transparent: true,
                    side: THREE.DoubleSide
                });
                const videoPlane = new THREE.Mesh(geometry, material);

                // 绑定到第一个识别目标（targets.mind里的ID 0）
                const anchor = mindarThree.addAnchor(0);
                anchor.group.add(videoPlane);

                // 启动AR并处理播放逻辑
                await mindarThree.start();
                renderer.setAnimationLoop(() => {
                    // 识别到拓片才播放视频
                    if (anchor.group.visible && video.paused) {
                        video.play().catch(err => console.log("视频播放触发:", err));
                    }
                    renderer.render(scene, camera);
                });

                // 兼容手机摄像头权限手动触发
                document.addEventListener('click', () => {
                    if (video.paused) video.play();
                });

            } catch (err) {
                alert('AR启动失败：' + err.message + '\n请检查网络或拓片识别文件');
                console.error('AR错误详情:', err);
            }
        });
    </script>
</body>
</html>
